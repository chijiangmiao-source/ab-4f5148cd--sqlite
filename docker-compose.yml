services:
  # Reviewer web + API service.
  web:
    build: .
    image: starborne-review:latest
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import json,urllib.request; "
             "r=urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5); "
             "assert json.loads(r.read())['status']=='ok'"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot verification gate: build checks + code tests (page-ownership
  # scenarios) + API/HTTP smoke (health endpoint, snapshot submissions,
  # API/page first-violation evidence parity). Reports via exit code.
  verify:
    build: .
    image: starborne-review:latest
    command: ["python", "verify.py"]
    environment:
      # Run the API/HTTP smoke against the real `web` service over the
      # compose network (stages 1-2 still execute inside this container).
      STARBORNE_BASE_URL: "http://web:8080"
    # `docker compose run verify` / `up verify` exits when done; its exit
    # code propagates so CI can fail on non-zero.
    restart: "no"
    depends_on:
      web:
        condition: service_healthy
